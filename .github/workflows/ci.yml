name: ci
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m particlelab demo > /tmp/particle-demo.json
      - run: python examples/render_demo.py /tmp/particle-demo.json --check
      - run: python examples/square_audit.py > /tmp/square-audit.json
      - run: python examples/render_square.py /tmp/square-audit.json --check
      - run: python examples/smoothing_audit.py > /tmp/smoothing-audit.json
      - run: python examples/render_smoothing.py /tmp/smoothing-audit.json --check
      - run: python examples/backward_audit.py > /tmp/backward-audit.json
      - run: python examples/render_backward.py /tmp/backward-audit.json --check
